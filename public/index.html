<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meshuggle 🎸</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --bg2:     #141414;
      --bg3:     #1e1e1e;
      --border:  #272727;
      --border2: #383838;
      --text:    #e8e8e8;
      --text2:   #888;
      --text3:   #4a4a4a;
      --green:      #4ade80;
      --green-bg:   #0a2016;
      --green-b:    #14532d;
      --red:        #f87171;
      --red-bg:     #200a0a;
      --red-b:      #7f1d1d;
      --yellow:     #fbbf24;
      --accent:     #a78bfa;
      --accent-dim: #1e1433;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    #shell {
      width: 100%;
      max-width: 980px;
      height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-bottom: 0.5rem;
    }

    /* ── Header row ── */
    #header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #header-row h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -1px; }
    #header-row h1 em { font-style: normal; color: var(--accent); }

    .tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .tab {
      padding: 0.45rem 1rem; background: transparent; border: none;
      color: var(--text2); font-size: 0.8rem; font-weight: 500;
      font-family: inherit; cursor: pointer; transition: all 0.15s;
      border-right: 1px solid var(--border);
    }
    .tab:last-child { border-right: none; }
    .tab.active { background: var(--bg3); color: var(--text); }
    .tab:hover:not(.active) { background: var(--bg2); }

    /* ── Stats bar ── */
    #stats-bar {
      flex-shrink: 0;
      display: flex;
      gap: 0;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .stat {
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 0.6rem 0.5rem;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }
    .stat-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.25rem; }
    .stat-val { font-size: 1.1rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .stat-val.green  { color: var(--green); }
    .stat-val.red    { color: var(--red); }
    .stat-val.yellow { color: var(--yellow); }
    .stat-val.accent { color: var(--accent); }

    /* strike pips inside stat bar */
    .strike-pips { display: flex; gap: 4px; align-items: center; }
    .sp {
      width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid var(--border2); background: transparent;
      transition: all 0.2s;
    }
    .sp.hit { background: var(--red); border-color: var(--red); }

    /* ── Main content area ── */
    #main {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 0.75rem;
    }

    /* ── Left: history feed ── */
    #feed-col {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    #feed-header {
      padding: 0.6rem 0.9rem;
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text3);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #feed-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #feed-scroll::-webkit-scrollbar { width: 3px; }
    #feed-scroll::-webkit-scrollbar-track { background: transparent; }
    #feed-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .feed-item {
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      font-size: 0.78rem;
    }
    .feed-item.correct { border-color: var(--green-b); background: var(--green-bg); }
    .feed-item.wrong   { border-color: var(--red-b);   background: var(--red-bg); }
    .feed-item.skipped { background: var(--bg3); }
    .feed-item.out-banner {
      background: transparent; border-color: var(--border2);
      text-align: center; color: var(--red); font-size: 0.72rem; font-weight: 500;
    }
    .fi-title { font-weight: 500; line-height: 1.3; margin-bottom: 2px; }
    .fi-sub   { font-size: 0.7rem; color: var(--text2); }
    .feed-item.correct .fi-sub { color: var(--green); opacity: 0.7; }
    .feed-item.wrong   .fi-sub { color: var(--red);   opacity: 0.65; }
    .fi-guesses { margin-top: 3px; }
    .fi-guess {
      font-size: 0.68rem; color: var(--text3);
      padding: 1px 0;
    }
    .fi-guess.wrong-g { color: var(--red); opacity: 0.6; }

    .feed-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; color: var(--text3); text-align: center; padding: 1rem;
    }

    /* ── Right: game panel ── */
    #game-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      overflow: hidden;
    }

    /* Player card */
    #player-card {
      flex-shrink: 0;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.1rem 1.25rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    }

    #song-label {
      font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text3);
    }

    .clip-btns { display: flex; gap: 8px; width: 100%; }
    .clip-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 0.65rem 1rem; border-radius: 999px;
      border: 1px solid var(--border2); background: var(--bg3);
      color: var(--text); font-size: 0.88rem; font-weight: 500;
      font-family: inherit; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
    }
    .clip-btn:hover:not(:disabled) { background: #252525; border-color: var(--accent); }
    .clip-btn:active:not(:disabled) { transform: scale(0.97); }
    .clip-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .clip-btn.alt.unlocked { border-color: var(--yellow); color: var(--yellow); }
    .clip-btn.alt.unlocked:hover:not(:disabled) { background: #1a1500; }

    #prog-wrap {
      width: 100%; height: 3px;
      background: var(--bg3); border-radius: 2px; overflow: hidden;
    }
    #prog-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 2px; transition: width 0.04s linear;
    }

    #hint { font-size: 0.78rem; color: var(--accent); min-height: 1em; text-align: center; }

    /* Current song wrong guesses */
    #current-guesses {
      width: 100%;
      display: flex; flex-direction: column; gap: 3px;
    }
    .cg-item {
      font-size: 0.75rem; color: var(--red); opacity: 0.7;
      padding: 0.25rem 0.5rem;
      background: var(--red-bg); border: 1px solid var(--red-b);
      border-radius: 6px;
      display: flex; justify-content: space-between;
    }
    .cg-attempt { color: var(--text3); font-size: 0.68rem; }

    /* Search */
    #search-wrap { position: relative; flex-shrink: 0; }
    #search-input {
      width: 100%; padding: 0.7rem 1rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-size: 0.92rem; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: var(--text3); }
    #search-input:disabled { opacity: 0.35; cursor: not-allowed; }

    #suggestions {
      display: none; position: absolute;
      bottom: calc(100% + 5px); left: 0; right: 0;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      max-height: 220px; overflow-y: auto; z-index: 50;
    }
    .sug {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.55rem 1rem; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background 0.1s;
      font-size: 0.85rem;
    }
    .sug:last-child { border-bottom: none; }
    .sug:hover { background: var(--bg3); }
    .sug-meta { font-size: 0.7rem; color: var(--text2); text-align: right; }

    /* Actions */
    #action-row { display: flex; gap: 8px; flex-shrink: 0; }
    #submit-btn, #skip-btn {
      flex: 1; padding: 0.68rem 1rem;
      border-radius: 10px; font-size: 0.88rem; font-weight: 500;
      font-family: inherit; cursor: pointer; border: 1px solid var(--border2);
      transition: all 0.15s;
    }
    #submit-btn { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
    #submit-btn:hover:not(:disabled) { opacity: 0.88; }
    #submit-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    #skip-btn { background: transparent; color: var(--text2); }
    #skip-btn:hover:not(:disabled) { background: var(--bg3); color: var(--text); }
    #skip-btn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* ── Results overlay ── */
    #results {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
    }
    #results.active { display: flex; }

    .results-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.25rem;
      text-align: center;
    }
    .results-card h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.3rem; }
    .results-card .score-sub { font-size: 0.85rem; color: var(--text2); margin-bottom: 1rem; }

    #share-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem; line-height: 1.8;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem; margin-bottom: 0.4rem;
      white-space: pre; cursor: pointer; transition: border-color 0.15s; user-select: none;
      text-align: left;
    }
    #share-box:hover { border-color: var(--accent); }
    #copy-tip { font-size: 0.7rem; color: var(--text3); margin-bottom: 0; }

    .name-entry { text-align: left; }
    .name-entry label {
      display: block; font-size: 0.72rem; color: var(--text2);
      margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .name-row { display: flex; gap: 8px; }
    .name-input {
      flex: 1; padding: 0.6rem 0.85rem;
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: 8px; color: var(--text);
      font-size: 0.9rem; font-family: inherit; outline: none;
      transition: border-color 0.15s;
    }
    .name-input:focus { border-color: var(--accent); }
    .name-input::placeholder { color: var(--text3); }
    .name-submit {
      padding: 0.6rem 1rem;
      background: var(--accent); color: #0a0a0a;
      border: none; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
    }
    .name-submit:hover { opacity: 0.88; }
    .name-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .name-error { font-size: 0.72rem; color: var(--red); margin-top: 0.4rem; min-height: 1em; }
    .name-skip {
      display: inline-block; margin-top: 0.5rem; font-size: 0.72rem;
      color: var(--text3); cursor: pointer; background: none; border: none;
      font-family: inherit; text-decoration: underline;
    }

    .submitted-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.78rem; color: var(--green);
      background: var(--green-bg); border: 1px solid var(--green-b);
      border-radius: 7px; padding: 0.35rem 0.75rem;
    }

    #again-btn {
      width: 100%; padding: 0.7rem;
      border-radius: 10px; border: 1px solid var(--border2);
      background: var(--bg3); color: var(--text);
      font-size: 0.9rem; font-weight: 500; font-family: inherit;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    #again-btn:hover { background: #252525; border-color: var(--accent); }

    /* ── Leaderboard view ── */
    #lb-view {
      display: none;
      flex: 1; min-height: 0;
      flex-direction: column; gap: 0.75rem;
    }
    #lb-view.active { display: flex; }

    .lb-header { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .lb-title { font-size: 0.95rem; font-weight: 500; }
    .lb-refresh {
      font-size: 0.72rem; color: var(--text2); cursor: pointer;
      background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 0.28rem 0.6rem; font-family: inherit;
      transition: all 0.15s;
    }
    .lb-refresh:hover { background: var(--bg3); color: var(--text); }

    #lb-scroll {
      flex: 1; min-height: 0; overflow-y: auto;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px;
    }
    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table th {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text3); padding: 0.5rem 0.9rem; text-align: left;
      border-bottom: 1px solid var(--border); position: sticky; top: 0;
      background: var(--bg2);
    }
    .lb-table th:last-child { text-align: right; }
    .lb-table td { padding: 0.6rem 0.9rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
    .lb-table td:last-child { text-align: right; }
    .lb-table tr:last-child td { border-bottom: none; }
    .lb-table tr:hover td { background: var(--bg3); }
    .lb-rank { color: var(--text3); font-size: 0.75rem; width: 32px; }
    .lb-name { font-weight: 500; }
    .lb-score { font-family: 'JetBrains Mono', monospace; }
    .lb-date  { color: var(--text3); font-size: 0.72rem; }
    .lb-score-hi  { color: var(--green); }
    .lb-score-mid { color: var(--yellow); }
    .lb-score-low { color: var(--text2); }
    .lb-empty   { text-align: center; padding: 2rem; color: var(--text3); font-size: 0.82rem; }
    .lb-loading { text-align: center; padding: 1.5rem; color: var(--text3); font-size: 0.82rem; }

    /* ── Spinner ── */
    .spin {
      display: inline-block; width: 10px; height: 10px;
      border: 1.5px solid var(--text3); border-top-color: var(--accent);
      border-radius: 50%; animation: rot 0.65s linear infinite;
      vertical-align: middle; margin-right: 5px;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="shell">

  <!-- Header -->
  <div id="header-row">
    <h1>Mesh<em>uggle</em> 🎸</h1>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('game')">Game</button>
      <button class="tab" onclick="switchTab('leaderboard')">Leaderboard</button>
    </div>
  </div>

  <!-- Stats bar -->
  <div id="stats-bar">
    <div class="stat">
      <div class="stat-label">Score</div>
      <div class="stat-val green" id="st-score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Outs</div>
      <div class="stat-val red" id="st-outs">0 / 3</div>
    </div>
    <div class="stat">
      <div class="stat-label">Skips left</div>
      <div class="stat-val yellow" id="st-skips">3</div>
    </div>
    <div class="stat">
      <div class="stat-label">Song</div>
      <div class="stat-val" id="st-song">1</div>
    </div>
    <div class="stat">
      <div class="stat-label">Strikes this song</div>
      <div class="stat-val">
        <div class="strike-pips">
          <div class="sp" id="sp0"></div>
          <div class="sp" id="sp1"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main area -->
  <div id="main">

    <!-- Left: feed -->
    <div id="feed-col">
      <div id="feed-header">History</div>
      <div id="feed-scroll">
        <div class="feed-empty" id="feed-empty">No songs yet —<br>make your first guess!</div>
      </div>
    </div>

    <!-- Right: game -->
    <div id="game-col">

      <!-- Game view -->
      <div id="game-view" style="display:flex; flex-direction:column; flex:1; gap:0.65rem; min-height:0;">

        <div id="player-card">
          <div id="song-label">Song #<span id="song-num">1</span></div>
          <div class="clip-btns">
            <button class="clip-btn" id="play-btn">▶&nbsp; Play clip</button>
            <button class="clip-btn alt" id="alt-btn" disabled title="Unlocks after 2 strikes">🔒 Alt clip</button>
          </div>
          <div id="prog-wrap"><div id="prog-fill"></div></div>
          <div id="hint"></div>
          <div id="current-guesses"></div>
        </div>

        <div id="search-wrap">
          <input id="search-input" type="text" placeholder="Search for a song…" autocomplete="off" spellcheck="false" />
          <div id="suggestions"></div>
        </div>

        <div id="action-row">
          <button id="submit-btn" disabled>Submit guess</button>
          <button id="skip-btn">Skip ⏭</button>
        </div>

        <!-- Results panel (replaces game controls) -->
        <div id="results">
          <div class="results-card">
            <h2 id="result-title"></h2>
            <p class="score-sub" id="result-sub"></p>
            <div id="share-box"></div>
            <p id="copy-tip">click to copy</p>
          </div>
          <div class="results-card">
            <div class="name-entry" id="name-entry">
              <label>Add your score to the leaderboard</label>
              <div class="name-row">
                <input class="name-input" id="name-input" type="text" maxlength="20" placeholder="Your name…" autocomplete="off" spellcheck="false" />
                <button class="name-submit" id="name-submit">Submit</button>
              </div>
              <div class="name-error" id="name-error"></div>
              <button class="name-skip" id="name-skip">skip, just play again</button>
            </div>
            <div id="submitted-area" style="display:none; text-align:center; margin-bottom:0.75rem;">
              <span class="submitted-badge">✓ Score submitted!</span>
            </div>
            <button id="again-btn">Play again</button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Leaderboard view (replaces main) -->
  <div id="lb-view">
    <div class="lb-header">
      <span class="lb-title">Top scores</span>
      <button class="lb-refresh" onclick="loadLeaderboard()">↻ Refresh</button>
    </div>
    <div id="lb-scroll">
      <div class="lb-loading"><span class="spin"></span>Loading…</div>
    </div>
  </div>

</div>

<audio id="audio" preload="none"></audio>

const CLIP_MS     = 3000;
const MAX_STRIKES = 3;
const MAX_OUTS    = 3;
const MAX_SKIPS   = 3;
const ALT_UNLOCK  = 2;
const ORDINALS    = ['1st try', '2nd try', '3rd try'];

let deck = [], used = new Set(), song = null;
let songNum = 0, score = 0, outs = 0, skipsLeft = MAX_SKIPS;
let strikes = 0;
let wrongGuesses = []; // [{attempt, name}] for current song
let feed = [];
let previewCache = {};
let clipStart = 0, altStart = 0; // locked per song
let progTimer = null, canPlay = true;
let scoreSubmitted = false;

const audio     = document.getElementById('audio');
const playBtn   = document.getElementById('play-btn');
const altBtn    = document.getElementById('alt-btn');
const progFill  = document.getElementById('prog-fill');
const hintEl    = document.getElementById('hint');
const searchEl  = document.getElementById('search-input');
const sugBox    = document.getElementById('suggestions');
const submitBtn = document.getElementById('submit-btn');
const skipBtn   = document.getElementById('skip-btn');
const feedScroll= document.getElementById('feed-scroll');
const resultsEl = document.getElementById('results');
const gameView  = document.getElementById('game-view');

audio.volume = 0.6;

// ── Tabs ──────────────────────────────────────
function switchTab(tab) {
  const isGame = tab === 'game';
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === 0 ? isGame : !isGame));
  document.getElementById('main').style.display = isGame ? '' : 'none';
  document.getElementById('lb-view').classList.toggle('active', !isGame);
  if (!isGame) loadLeaderboard();
}

// ── Deck ──────────────────────────────────────
function refillDeck() {
  let pool = ALL_SONGS.filter(s => !used.has(s.t));
  if (pool.length < 5) { used.clear(); pool = [...ALL_SONGS]; }
  deck = shuffle(pool);
}
function nextSong() {
  if (deck.length === 0) refillDeck();
  song = deck.pop();
  used.add(song.t);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── iTunes ────────────────────────────────────
async function fetchPreview(s) {
  const key = s.t;
  if (key in previewCache) return previewCache[key];
  previewCache[key] = null;
  try {
    const q = encodeURIComponent(`meshuggah ${s.t}`);
    const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&media=music&limit=8`);
    const data = await res.json();
    const items = data.results || [];
    const tl = s.t.toLowerCase();
    const match = items.find(i => i.trackName?.toLowerCase() === tl && i.previewUrl)
                || items.find(i => i.trackName?.toLowerCase().includes(tl) && i.previewUrl)
                || items.find(i => i.previewUrl);
    previewCache[key] = match?.previewUrl || null;
  } catch {}
  return previewCache[key];
}
function prefetch() { deck.slice(-2).forEach(s => fetchPreview(s)); }

// ── Init ──────────────────────────────────────
function init() {
  deck = []; used = new Set();
  score = 0; outs = 0; skipsLeft = MAX_SKIPS; songNum = 0; feed = [];
  previewCache = {}; scoreSubmitted = false;
  resultsEl.classList.remove('active');
  resultsEl.style.display = 'none';
  document.getElementById('player-card').style.display = '';
  document.getElementById('search-wrap').style.display = '';
  document.getElementById('action-row').style.display = '';
  feedScroll.innerHTML = '<div class="feed-empty" id="feed-empty">No songs yet —<br>make your first guess!</div>';
  refillDeck();
  nextSong();
  setupSong();
  updateStats();
}

function setupSong() {
  songNum++; strikes = 0; wrongGuesses = []; canPlay = true;
  // Lock in random clip starts for this song
  clipStart = Math.floor(Math.random() * 15);       // 0–14s into preview
  altStart  = 15 + Math.floor(Math.random() * 12);  // 15–26s

  submitBtn.disabled = true;
  skipBtn.disabled = skipsLeft <= 0;
  searchEl.disabled = false;
  searchEl.value = '';
  searchEl._chosen = null;
  sugBox.style.display = 'none';
  document.getElementById('song-num').textContent = songNum;
  document.getElementById('st-song').textContent = songNum;
  progFill.style.width = '0%';
  hintEl.textContent = '';
  playBtn.disabled = false;
  playBtn.innerHTML = '▶&nbsp; Play clip';
  altBtn.disabled = true;
  altBtn.className = 'clip-btn alt';
  altBtn.innerHTML = '🔒 Alt clip';
  document.getElementById('current-guesses').innerHTML = '';
  document.getElementById('search-wrap').style.display = '';
  document.getElementById('action-row').style.display = '';
  updateStrikes();
  fetchPreview(song).then(prefetch);
}

function updateStats() {
  document.getElementById('st-score').textContent = score;
  document.getElementById('st-outs').textContent = `${outs} / ${MAX_OUTS}`;
  document.getElementById('st-skips').textContent = skipsLeft;
}

function updateStrikes() {
  // Only show 2 pips — 3rd strike = out (no need to show)
  for (let i = 0; i < 2; i++) {
    document.getElementById(`sp${i}`).className = 'sp' + (i < strikes ? ' hit' : '');
  }
  if (strikes >= ALT_UNLOCK) {
    altBtn.disabled = false;
    altBtn.className = 'clip-btn alt unlocked';
    altBtn.innerHTML = '🎵 Alt clip';
  }
}

function updateCurrentGuesses() {
  const el = document.getElementById('current-guesses');
  el.innerHTML = '';
  wrongGuesses.forEach((g, i) => {
    const d = document.createElement('div');
    d.className = 'cg-item';
    d.innerHTML = `<span>✗ ${escHtml(g.name)}</span><span class="cg-attempt">${ORDINALS[i]}</span>`;
    el.appendChild(d);
  });
}

// ── Playback ──────────────────────────────────
async function playClip(useAlt) {
  if (!canPlay) return;
  canPlay = false;
  const btn = useAlt ? altBtn : playBtn;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';

  const url = await fetchPreview(song);

  if (!url) {
    hintEl.innerHTML = '<span style="color:var(--red)">No preview — skip to continue</span>';
    btn.innerHTML = useAlt ? '🎵 Alt clip' : '▶&nbsp; Play clip';
    btn.disabled = useAlt ? strikes < ALT_UNLOCK : false;
    canPlay = true;
    return;
  }

  const start = useAlt ? altStart : clipStart;
  audio.src = url;
  audio.currentTime = start;
  audio.volume = 0.6;

  if (!useAlt) playBtn.innerHTML = '■&nbsp; Playing…';
  else { altBtn.innerHTML = '■&nbsp; Playing…'; playBtn.innerHTML = '▶&nbsp; Replay'; }
  progFill.style.width = '0%';

  try { await audio.play(); }
  catch {
    hintEl.textContent = 'Tap Play to start audio';
    playBtn.innerHTML = '▶&nbsp; Play clip';
    if (strikes >= ALT_UNLOCK) altBtn.innerHTML = '🎵 Alt clip';
    playBtn.disabled = false;
    altBtn.disabled = strikes < ALT_UNLOCK;
    canPlay = true;
    return;
  }

  const t0 = Date.now();
  clearInterval(progTimer);
  progTimer = setInterval(() => {
    progFill.style.width = Math.min(100, ((Date.now() - t0) / CLIP_MS) * 100) + '%';
  }, 40);

  setTimeout(() => {
    audio.pause(); clearInterval(progTimer);
    progFill.style.width = '100%';
    playBtn.innerHTML = '▶&nbsp; Replay';
    playBtn.disabled = false;
    if (strikes >= ALT_UNLOCK) { altBtn.innerHTML = '🎵 Alt clip'; altBtn.disabled = false; }
    canPlay = true;
  }, CLIP_MS);
}

// ── Search ────────────────────────────────────
function renderSuggestions(q) {
  if (!q.trim()) { sugBox.style.display = 'none'; return; }
  const low = q.toLowerCase();
  const hits = ALL_SONGS.filter(s => s.t.toLowerCase().includes(low)).slice(0, 10);
  if (!hits.length) { sugBox.style.display = 'none'; return; }
  sugBox.innerHTML = '';
  hits.forEach(s => {
    const d = document.createElement('div'); d.className = 'sug';
    d.innerHTML = `<span>${s.t}</span><span class="sug-meta">${s.a}</span>`;
    d.addEventListener('mousedown', e => { e.preventDefault(); pick(s); });
    sugBox.appendChild(d);
  });
  sugBox.style.display = 'block';
}
function pick(s) {
  searchEl._chosen = s; searchEl.value = s.t;
  sugBox.style.display = 'none'; submitBtn.disabled = false;
}

// ── Guess ─────────────────────────────────────
function submitGuess() {
  const chosen = searchEl._chosen;
  if (!chosen) return;
  resolve(chosen.t.toLowerCase() === song.t.toLowerCase() ? 'correct' : 'wrong', chosen.t);
}
function doSkip() {
  if (skipsLeft <= 0) return;
  skipsLeft--;
  updateStats();
  resolve('skipped', null);
}

function resolve(result, guessName) {
  audio.pause(); clearInterval(progTimer);

  if (result === 'correct') {
    score++;
    updateStats();
    addFeedItem('correct', song, strikes, wrongGuesses);
    advanceSong();
    return;
  }

  if (result === 'skipped') {
    addFeedItem('skipped', song, 0, []);
    revealAndAdvance(false);
    return;
  }

  // Wrong
  wrongGuesses.push({ name: guessName, attempt: strikes });
  strikes++;
  updateStrikes();
  updateCurrentGuesses();
  searchEl._chosen = null; searchEl.value = ''; submitBtn.disabled = true;
  sugBox.style.display = 'none';

  if (strikes >= MAX_STRIKES) {
    outs++;
    updateStats();
    addFeedItem('wrong', song, strikes, wrongGuesses);
    addOutBanner();
    if (outs >= MAX_OUTS) { setTimeout(showResults, 1800); }
    else { revealAndAdvance(true); }
    return;
  }

  if (strikes === 1) hintEl.textContent = `Hint: album — "${song.a}"`;
}

function revealAndAdvance(wasOut) {
  hintEl.textContent = `${wasOut ? 'Out! ' : '⏭ '}Answer: ${song.t} — ${song.a}`;
  document.getElementById('search-wrap').style.display = 'none';
  document.getElementById('action-row').style.display = 'none';
  searchEl.disabled = true; submitBtn.disabled = true; skipBtn.disabled = true;
  setTimeout(advanceSong, wasOut ? 2000 : 1600);
}

function advanceSong() {
  if (outs >= MAX_OUTS) { showResults(); return; }
  nextSong(); setupSong();
}

// ── Feed ──────────────────────────────────────
function addFeedItem(result, s, strikesUsed, guesses) {
  feed.unshift({ result, song: s, strikesUsed, guesses: [...guesses] });
  renderFeed();
}

function addOutBanner() {
  const d = document.createElement('div');
  d.className = 'feed-item out-banner';
  d.textContent = `— Out ${outs} of ${MAX_OUTS} —`;
  feedScroll.insertBefore(d, feedScroll.firstChild);
}

function renderFeed() {
  // Remove empty state
  const empty = document.getElementById('feed-empty');
  if (empty) empty.remove();

  // Remove old feed items (not banners)
  Array.from(feedScroll.querySelectorAll('.feed-item:not(.out-banner)')).forEach(e => e.remove());

  // Re-insert feed items after banners
  const banners = Array.from(feedScroll.querySelectorAll('.out-banner'));
  // Clear and rebuild
  feedScroll.innerHTML = '';
  banners.forEach(b => feedScroll.appendChild(b));

  feed.forEach(h => {
    const icon = h.result === 'correct' ? '✓' : h.result === 'skipped' ? '⏭' : '✗';
    const sub  = h.result === 'correct'
      ? (h.strikesUsed === 0 ? 'first try!' : `${ORDINALS[h.strikesUsed - 1] || h.strikesUsed + ' strikes'}`)
      : h.song.a;
    const d = document.createElement('div');
    d.className = `feed-item ${h.result}`;
    let guessHtml = '';
    if (h.guesses && h.guesses.length) {
      guessHtml = '<div class="fi-guesses">' +
        h.guesses.map((g, i) => `<div class="fi-guess wrong-g">✗ ${escHtml(g.name)} <span style="opacity:0.5">(${ORDINALS[i]})</span></div>`).join('') +
        '</div>';
    }
    d.innerHTML = `<div class="fi-title">${escHtml(h.song.t)} <span style="float:right">${icon}</span></div><div class="fi-sub">${sub}</div>${guessHtml}`;
    feedScroll.appendChild(d);
  });
}

// ── Results ───────────────────────────────────
function showResults() {
  document.getElementById('player-card').style.display = 'none';
  document.getElementById('search-wrap').style.display = 'none';
  document.getElementById('action-row').style.display = 'none';
  resultsEl.style.display = 'flex';
  resultsEl.classList.add('active');

  const titles = ['Time for a deep listen 😬','You got one! 🤙','Getting there 🎸','Solid knowledge 🎧','Meshuggah expert 🔥','Inhuman 🥁'];
  document.getElementById('result-title').textContent = titles[Math.min(score, titles.length - 1)];
  document.getElementById('result-sub').textContent = `${score} song${score !== 1 ? 's' : ''} correct before 3 outs`;

  const correct = feed.filter(h => h.result === 'correct').length;
  const wrong   = feed.filter(h => h.result === 'wrong').length;
  const skipped = feed.filter(h => h.result === 'skipped').length;
  const shareText = `Meshuggle 🎸\nScore: ${score}\n✓ ${correct}  ✗ ${wrong}  ⏭ ${skipped}`;

  const shareBox = document.getElementById('share-box');
  shareBox.textContent = shareText;
  shareBox.onclick = () => {
    navigator.clipboard.writeText(shareText).catch(() => {});
    document.getElementById('copy-tip').textContent = 'Copied!';
    setTimeout(() => { document.getElementById('copy-tip').textContent = 'click to copy'; }, 2000);
  };

  document.getElementById('submitted-area').style.display = 'none';
  document.getElementById('name-entry').style.display = '';
  document.getElementById('name-input').value = '';
  document.getElementById('name-error').textContent = '';

  document.getElementById('name-submit').onclick = async () => {
    if (scoreSubmitted) return;
    const name = document.getElementById('name-input').value.trim();
    if (!name) { document.getElementById('name-error').textContent = 'Please enter a name.'; return; }
    const btn = document.getElementById('name-submit');
    btn.disabled = true; btn.textContent = '…';
    try {
      const res = await fetch('/.netlify/functions/leaderboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, score }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('name-error').textContent = data.error || 'Submission failed.';
        btn.disabled = false; btn.textContent = 'Submit';
        return;
      }
      scoreSubmitted = true;
      document.getElementById('name-entry').style.display = 'none';
      document.getElementById('submitted-area').style.display = 'block';
    } catch {
      document.getElementById('name-error').textContent = 'Network error — try again.';
      btn.disabled = false; btn.textContent = 'Submit';
    }
  };

  document.getElementById('name-skip').onclick = () => { document.getElementById('name-entry').style.display = 'none'; };
  document.getElementById('again-btn').onclick = init;
}

// ── Leaderboard ───────────────────────────────
async function loadLeaderboard() {
  const el = document.getElementById('lb-scroll');
  el.innerHTML = '<div class="lb-loading"><span class="spin"></span>Loading…</div>';
  try {
    const res = await fetch('/.netlify/functions/leaderboard');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const entries = await res.json();
    if (!Array.isArray(entries) || !entries.length) {
      el.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
      return;
    }
    const medals = ['🥇','🥈','🥉'];
    const sc = s => s >= 10 ? 'lb-score-hi' : s >= 5 ? 'lb-score-mid' : 'lb-score-low';
    el.innerHTML = `<table class="lb-table">
      <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Date</th></tr></thead>
      <tbody>${entries.map((e, i) => `<tr>
        <td class="lb-rank">${medals[i] || (i+1)+'.'}</td>
        <td class="lb-name">${escHtml(e.name)}</td>
        <td class="lb-score ${sc(e.score)}">${e.score}</td>
        <td class="lb-date">${e.date || ''}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  } catch(err) {
    el.innerHTML = `<div class="lb-empty">Failed to load (${err.message})</div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Events ────────────────────────────────────
playBtn.addEventListener('click', () => playClip(false));
altBtn.addEventListener('click',  () => playClip(true));
searchEl.addEventListener('input', e => {
  renderSuggestions(e.target.value);
  if (!e.target.value) { searchEl._chosen = null; submitBtn.disabled = true; }
});
searchEl.addEventListener('blur', () => setTimeout(() => { sugBox.style.display = 'none'; }, 160));
searchEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !submitBtn.disabled) submitGuess(); });
submitBtn.addEventListener('click', submitGuess);
skipBtn.addEventListener('click', doSkip);

init();
</script>
